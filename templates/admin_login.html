<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H&S Clothing - Admin Login</title>

```
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
    }

    .login-box {
        width: 380px;
        max-width: 90%;
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    h1 {
        text-align: center;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 30px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 13px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
    }

    button {
        width: 100%;
        padding: 14px;
        background: #111;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #333;
    }

    #message {
        margin-top: 15px;
        text-align: center;
        color: red;
    }
</style>
```

</head>

<body>

<div class="login-box">

```
<h1>H&S Clothing</h1>

<p class="subtitle">Admin Login</p>

<form id="loginForm">

    <label>Email</label>

    <input
        type="email"
        id="email"
        placeholder="Admin email"
        required
    >

    <label>Password</label>

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

<div id="message"></div>
```

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    try {

        const response = await fetch("/api/admin/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (response.ok) {
            window.location.href = "/admin";
        } else {
            message.textContent = data.error || "Login failed";
        }

    } catch (error) {
        message.textContent = "Unable to connect to server.";
    }

});
</script>

</body>
</html>
