<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>H&S Clothing | Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at top, #252525 0%, #0b0b0b 45%, #000 100%);
            font-family: Arial, sans-serif;
            color: white;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: rgba(20, 20, 20, 0.96);
            border: 1px solid #333;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 25px 70px rgba(0,0,0,.6);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .logo span {
            color: #d4af37;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 35px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: #111;
            border: 1px solid #333;
            color: white;
            border-radius: 9px;
            outline: none;
        }

        input:focus {
            border-color: #d4af37;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #d4af37;
            color: #000;
            font-weight: 800;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: .9;
        }

        .message {
            margin-top: 18px;
            text-align: center;
            min-height: 20px;
            font-size: 14px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        H<span>&</span>S
    </div>

    <div class="subtitle">
        Clothing Admin Panel
    </div>

    <form id="loginForm">

        <label>Admin Email</label>

        <input
            type="email"
            id="username"
            placeholder="Enter admin email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            LOGIN TO DASHBOARD
        </button>

    </form>

    <div class="message" id="message"></div>

    <a href="/" class="back">
        ← Back to H&S Clothing
    </a>

</div>

<script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        message.textContent = "Logging in...";
        message.style.color = "#aaa";

        try {
            const response = await fetch("/api/admin/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include",
                body: JSON.stringify({
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value
                })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                message.textContent = "Login successful.";
                message.style.color = "#4caf50";

                setTimeout(() => {
                    window.location.href = "/admin";
                }, 500);
            } else {
                message.textContent = data.message || "Invalid login.";
                message.style.color = "#ff5252";
            }

        } catch (error) {
            message.textContent = "Unable to connect to server.";
            message.style.color = "#ff5252";
        }
    });
</script>

</body>
</html>
