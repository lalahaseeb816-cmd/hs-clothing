<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H&S Clothing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #222;
            color: white;
            padding: 1.5rem;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #333;
        }
        nav a {
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            text-align: center;
        }
        nav a:hover {
            background-color: #ddd;
            color: black;
        }
        .container {
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }
        .section-title {
            text-align: center;
            margin: 20px 0;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 280px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 4px;
        }
        .card h3 {
            margin: 10px 0;
        }
        .card p {
            color: #28a745;
            font-weight: bold;
        }
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <header>
        <h1>H&S Clothing</h1>
        <p>Celebrity Inspired Fashion</p>
    </header>

    <nav>
        <a href="#men">Men's Collection</a>
        <a href="#women">Women's Collection</a>
        <a href="#about">About Us</a>
    </nav>

    <div class="container">
        
        <h2 id="women" class="section-title">Women's Collection</h2>
        <div class="products">
            <div class="card">
                <img src="https://via.placeholder.com/280x250" alt="Women Outfit 1">
                <h3>Celebrity Style Outfit 1</h3>
                <p>$49.99</p>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/280x250" alt="Women Outfit 2">
                <h3>Celebrity Style Outfit 2</h3>
                <p>$59.99</p>
            </div>
        </div>

        <h2 id="men" class="section-title">Men's Collection</h2>
        <div class="products">
            <div class="card">
                <img src="https://via.placeholder.com/280x250" alt="Men Outfit 1">
                <h3>Celebrity Style Outfit 1</h3>
                <p>$69.99</p>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/280x250" alt="Men Outfit 2">
                <h3>Celebrity Style Outfit 2</h3>
                <p>$79.99</p>
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; H&S Clothing. All rights reserved.</p>
    </footer>

</body>
</html>
