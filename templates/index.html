<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>H&S Clothing | Premium Fashion</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Montserrat", sans-serif;
            background: #fff;
            color: #111;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input {
            font-family: inherit;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255,255,255,.96);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid #eee;
        }

        .nav-container {
            max-width: 1300px;
            margin: auto;
            min-height: 75px;
            padding: 0 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .logo span {
            color: #b8941f;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            font-size: 13px;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #b8941f;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-btn {
            border: none;
            background: #111;
            color: white;
            padding: 11px 17px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
        }

        .cart-btn:hover {
            background: #b8941f;
            color: #000;
        }

        .cart-count {
            background: #d4af37;
            color: #000;
            padding: 2px 7px;
            border-radius: 20px;
            margin-left: 4px;
        }

        .mobile-btn {
            display: none;
            border: none;
            background: #111;
            color: white;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            min-height: 650px;

            background:
                linear-gradient(
                    rgba(0,0,0,.62),
                    rgba(0,0,0,.62)
                ),
                url("https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=1800&q=85")
                center/cover;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
            color: white;

            padding: 50px 20px;
        }

        .hero-content {
            max-width: 850px;
        }

        .hero-small {
            letter-spacing: 5px;
            font-size: 13px;
            color: #d4af37;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .hero h1 {
            font-size: clamp(45px, 8vw, 95px);
            line-height: .95;
            margin-bottom: 25px;
        }

        .hero p {
            font-size: 17px;
            color: #ddd;
            margin-bottom: 30px;
        }

        .hero-btn {
            display: inline-block;
            background: #fff;
            color: #111;
            padding: 15px 28px;
            border-radius: 4px;
            font-weight: 800;
        }

        .hero-btn:hover {
            background: #d4af37;
        }


        /* =====================================================
           GENERAL SECTIONS
        ===================================================== */

        .section {
            max-width: 1300px;
            margin: auto;
            padding: 80px 25px;
        }

        .section-heading {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-heading small {
            color: #b8941f;
            letter-spacing: 3px;
            font-weight: 700;
        }

        .section-heading h2 {
            font-size: 40px;
            margin-top: 10px;
        }


        /* =====================================================
           CATEGORIES
        ===================================================== */

        .categories {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 18px;
        }

        .category-card {
            height: 260px;
            position: relative;
            overflow: hidden;
            border-radius: 5px;
            cursor: pointer;
        }

        .category-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: .5s;
        }

        .category-card:hover img {
            transform: scale(1.08);
        }

        .category-overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    transparent,
                    rgba(0,0,0,.75)
                );

            display: flex;
            align-items: flex-end;

            padding: 25px;
            color: white;
        }

        .category-overlay h3 {
            font-size: 22px;
        }


        /* =====================================================
           SHOP CONTROLS
        ===================================================== */

        .shop-controls {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 10px;
            margin-bottom: 35px;

            flex-wrap: wrap;
        }

        .search-box {
            display: flex;

            border: 1px solid #ddd;
            border-radius: 5px;

            overflow: hidden;

            width: min(500px,100%);
        }

        .search-box input {
            flex: 1;

            border: none;
            outline: none;

            padding: 14px;
        }

        .search-box button {
            border: none;
            background: #111;
            color: white;

            padding: 0 20px;

            cursor: pointer;
        }

        .search-box button:hover {
            background: #b8941f;
            color: #000;
        }

        .filter-btn {
            border: 1px solid #ddd;
            background: white;

            padding: 12px 17px;

            border-radius: 4px;

            cursor: pointer;
            font-weight: 600;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: #111;
            color: white;
        }


        /* =====================================================
           PRODUCTS

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 25px;
        }

        .product-card {
            background: white;

            border: 1px solid #eee;
            border-radius: 5px;

            overflow: hidden;

            transition: .3s;
        }

        .product-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 15px 35px rgba(0,0,0,.1);
        }

        .product-image {
            width: 100%;
            height: 340px;

            object-fit: cover;

            display: block;
        }

        .product-info {
            padding: 18px;
        }

        .product-tag {
            color: #b8941f;

            font-size: 10px;

            text-transform: uppercase;

            font-weight: 800;

            letter-spacing: 1px;
        }

        .product-name {
            margin: 7px 0;

            font-size: 16px;
        }

        .product-type {
            color: #888;

            font-size: 12px;
        }

        .product-bottom {
            margin-top: 15px;

            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 10px;
        }

        .product-price {
            font-weight: 800;
        }

        .add-btn {
            border: none;

            background: #111;
            color: white;

            padding: 9px 12px;

            border-radius: 4px;

            cursor: pointer;

            font-size: 12px;
        }

        .add-btn:hover {
            background: #d4af37;
            color: #000;
        }

        .out-stock {
            color: #d32f2f;

            font-size: 12px;

            font-weight: 700;
        }


        /* =====================================================
           CELEBRITY
        ===================================================== */

        .celebs {
            background: #f7f7f7;
        }

        .celebrity-grid {
            max-width: 1300px;

            margin: auto;

            padding: 0 25px 80px;

            display: grid;

            grid-template-columns:
                repeat(4,1fr);

            gap: 20px;
        }

        .celebrity-card {
            height: 400px;

            position: relative;

            overflow: hidden;
        }

        .celebrity-card img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            transition: .5s;
        }

        .celebrity-card:hover img {
            transform: scale(1.05);
        }

        .celebrity-text {
            position: absolute;

            bottom: 0;
            left: 0;
            right: 0;

            padding: 25px;

            color: white;

            background:
                linear-gradient(
                    transparent,
                    rgba(0,0,0,.8)
                );
        }


        /* =====================================================
           CART
        ===================================================== */

        .cart-overlay {
            position: fixed;

            inset: 0;

            background: rgba(0,0,0,.55);

            z-index: 2000;

            display: none;
        }

        .cart-overlay.show {
            display: block;
        }

        .cart-panel {
            position: absolute;

            right: 0;
            top: 0;
            bottom: 0;

            width: min(450px,100%);

            background: white;

            padding: 25px;

            overflow-y: auto;
        }

        .cart-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
        }

        .close-cart {
            border: none;

            background: #eee;

            width: 35px;
            height: 35px;

            border-radius: 50%;

            cursor: pointer;

            font-size: 20px;
        }

        .cart-item {
            display: grid;

            grid-template-columns:
                65px 1fr auto;

            gap: 12px;

            padding: 15px 0;

            border-bottom: 1px solid #eee;

            align-items: center;
        }

        .cart-item img {
            width: 65px;
            height: 75px;

            object-fit: cover;
        }

        .cart-item h4 {
            font-size: 13px;

            margin-bottom: 5px;
        }

        .cart-item p {
            font-size: 12px;

            color: #777;
        }

        .quantity {
            display: flex;

            align-items: center;

            gap: 7px;

            margin-top: 8px;
        }

        .quantity button {
            border: 1px solid #ddd;

            background: white;

            width: 25px;
            height: 25px;

            cursor: pointer;
        }

        .remove {
            border: none;

            background: transparent;

            color: #d32f2f;

            cursor: pointer;

            font-size: 11px;
        }

        .cart-total {
            margin-top: 25px;

            display: flex;

            justify-content: space-between;

            font-size: 20px;

            font-weight: 800;
        }

        .checkout {
            width: 100%;

            margin-top: 20px;

            padding: 15px;

            border: none;

            background: #111;

            color: white;

            font-weight: 800;

            cursor: pointer;
        }

        .checkout:hover {
            background: #d4af37;
            color: #000;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {
            background: #080808;

            color: white;

            padding: 60px 25px 30px;
        }

        .footer-inner {
            max-width: 1300px;

            margin: auto;

            display: grid;

            grid-template-columns:
                2fr 1fr 1fr;

            gap: 40px;
        }

        footer h3 {
            margin-bottom: 15px;
        }

        footer p,
        footer a {
            color: #999;

            font-size: 13px;

            line-height: 2;
        }

        footer a:hover {
            color: white;
        }

        .copyright {
            max-width: 1300px;

            margin: 40px auto 0;

            padding-top: 20px;

            border-top: 1px solid #222;

            color: #666;

            font-size: 12px;
        }


        /* =====================================================
           TOAST
        ===================================================== */

        .toast {
            position: fixed;

            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            background: #111;
            color: white;

            padding: 13px 20px;

            border-radius: 5px;

            z-index: 5000;

            display: none;
        }

        .toast.show {
            display: block;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width:1000px) {

            .products-grid {
                grid-template-columns:
                    repeat(3,1fr);
            }

            .categories {
                grid-template-columns:
                    repeat(2,1fr);
            }

            .celebrity-grid {
                grid-template-columns:
                    repeat(2,1fr);
            }
