<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>H&S Clothing | Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #111;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #111;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        button:disabled {
            background: #777;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
            min-height: 20px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #111;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <div class="logo">
            H&S CLOTHING
        </div>

        <p class="subtitle">
            Administrator Login
        </p>


        <form id="adminLoginForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter admin username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>

        </form>


        <p id="message"></p>


        <a href="/" class="back">
            ← Back to H&S Clothing
        </a>

    </div>


    <script>

        const form =
            document.getElementById("adminLoginForm");

        const button =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;


                message.textContent = "";
                message.style.color = "";


                button.disabled = true;
                button.textContent = "Logging in...";


                try {

                    const response =
                        await fetch(
                            "/api/admin/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                credentials: "include",

                                body: JSON.stringify({
                                    username: username,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (response.ok) {

                        message.textContent =
                            "Login successful. Redirecting...";

                        message.style.color =
                            "green";


                        window.location.href =
                            "/admin";

                    } else {

                        message.textContent =
                            data.error ||
                            "Invalid username or password.";

                        message.style.color =
                            "red";

                    }


                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to connect to the server.";

                    message.style.color =
                        "red";

                }


                button.disabled = false;
                button.textContent = "Login";

            }
        );

    </script>

</body>

          </html>
